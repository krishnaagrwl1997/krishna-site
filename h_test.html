<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hang Out With K</title>
<meta name="description" content="A picnic mat in the sun. Sit down, have some chai, steal a charger.">
<meta property="og:title" content="Hang out with K">
<meta property="og:description" content="A picnic mat in the sun. Sit down, have some chai, steal a charger.">
<meta name="theme-color" content="#7fb6e8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Instrument+Sans:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{--ink:#1d1a16;--paper:#fbf6ea;--red:#d8352a;--olive:#5d6b3a;--sky:#8cc2ee;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--f-hand:"Caveat","Segoe Print",cursive;--f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--sky);overflow:hidden;color:var(--ink);font:400 16px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ui{position:fixed;inset:0;pointer-events:none;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.title{pointer-events:auto;background:var(--paper);padding:10px 16px 8px;transform:rotate(-2deg);box-shadow:0 10px 22px #0003;position:relative}
.title::before{content:"";position:absolute;left:50%;top:-10px;width:70px;height:20px;transform:translateX(-50%) rotate(3deg);background:#f3d9787a;border:1px solid #0000000d}
.title h1{margin:0;font:700 clamp(30px,5vw,46px)/.9 var(--f-hand)}
.title h1 em{font-style:normal;color:var(--red)}
.title p{margin:4px 0 0;font:600 13px/1.3 var(--f-body);color:#5a5246}
.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pill{pointer-events:auto;border:2px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:999px;padding:8px 14px;font:700 13px/1 var(--f-body);cursor:pointer;text-decoration:none;box-shadow:0 3px 0 var(--ink);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pill:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.pill:focus-visible,.note button:focus-visible,.note a:focus-visible{outline:3px solid #2438d8;outline-offset:3px}
.hint{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%) rotate(-1deg);background:#1d1a16e0;color:#fff;font:700 22px/1 var(--f-hand);padding:8px 16px;border-radius:999px;transition:opacity .5s;white-space:nowrap}
.hint.off{opacity:0}
.tip{position:fixed;left:0;top:0;pointer-events:none;background:var(--paper);color:var(--ink);font:700 20px/1 var(--f-hand);padding:5px 10px;border-radius:6px;box-shadow:0 6px 14px #0003;transform:translate(-50%,-150%) rotate(-2deg);opacity:0;transition:opacity .15s;white-space:nowrap}
.tip.on{opacity:1}
.say{position:fixed;left:0;top:0;pointer-events:none;max-width:min(260px,70vw);background:#fff;color:var(--ink);font:600 15px/1.3 var(--f-body);padding:9px 12px;border-radius:14px;box-shadow:0 8px 18px #0003;transform:translate(-50%,-100%) scale(.6);opacity:0;transition:opacity .2s,transform .25s cubic-bezier(.3,1.6,.5,1)}
.say::after{content:"";position:absolute;left:50%;bottom:-8px;border:8px solid transparent;border-top-color:#fff;border-bottom:0;transform:translateX(-50%)}
.say.on{opacity:1;transform:translate(-50%,-100%) scale(1)}
.note{position:fixed;right:16px;bottom:max(16px,env(safe-area-inset-bottom));width:min(360px,calc(100vw - 32px));max-height:min(62vh,560px);overflow:auto;pointer-events:auto;background:var(--paper);padding:20px 20px 18px;box-shadow:0 22px 44px #0005;transform:rotate(1.2deg);
  background-image:repeating-linear-gradient(transparent 0 27px,#a9c8e655 27px 28px);animation:noteIn .45s cubic-bezier(.3,1.4,.5,1)}
.note[hidden]{display:none}
@keyframes noteIn{from{transform:translateY(40px) rotate(-6deg);opacity:0}}
.note .k{font:700 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--red)}
.note h2{margin:6px 0 8px;font:700 34px/1 var(--f-hand)}
.note p{margin:0 0 10px}
.note ul{margin:0 0 10px;padding-left:20px}
.note .x{position:absolute;right:8px;top:6px;border:0;background:none;font:700 22px/1 var(--f-mono);cursor:pointer;color:var(--ink);padding:6px}
.note .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.note .acts button,.note .acts a{border:2px solid var(--ink);background:#ffd21f;color:var(--ink);border-radius:999px;padding:8px 12px;font:700 13px/1 var(--f-body);cursor:pointer;text-decoration:none}
.note .yt{aspect-ratio:16/9;background:#000;margin:8px 0}.note .yt iframe{width:100%;height:100%;border:0;display:block}
.note .pol{display:grid;justify-items:center;gap:6px;margin:6px 0 10px}
.note .pol figure{margin:0;background:#fff;padding:10px 10px 34px;box-shadow:0 8px 18px #0003;transform:rotate(var(--r,-2deg));width:min(220px,70%);position:relative}
.note .pol img{width:100%;aspect-ratio:1;object-fit:cover;object-position:50% 20%;display:block;background:#eee}
.note .pol figcaption{position:absolute;left:0;right:0;bottom:6px;text-align:center;font:700 20px/1 var(--f-hand)}
.note form{display:flex;gap:6px}
.note input{flex:1;min-width:0;border:2px solid var(--ink);border-radius:999px;padding:8px 12px;font:600 15px/1 var(--f-body);background:#fff}
.load{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(#8cc2ee,#cfe6c4);font:700 30px/1 var(--f-hand);color:var(--ink);transition:opacity .8s}
.load.off{opacity:0;pointer-events:none}
.load span{animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
@media (max-width:640px){.title p{display:none}.note{right:8px;left:8px;width:auto;max-height:52vh}.hint{font-size:19px}}
@media (prefers-reduced-motion:reduce){.note,.load span{animation:none}}
</style>
</head>
<body>
<canvas id="gl" aria-label="A picnic mat in a sunny park with Krishna sitting on it. Tap things on the mat."></canvas>
<div class="ui">
  <div class="top">
    <div class="title"><h1>hang out <em>with K</em></h1><p>pull up a spot. the chai’s still warm.</p></div>
    <div class="btns"><button class="pill" id="snd" type="button" aria-pressed="false">🔈 sound off</button><a class="pill" href="./">← secret files</a></div>
  </div>
</div>
<div class="hint" id="hint">tap anything on the mat ✨</div>
<div class="tip" id="tip"></div>
<div class="say" id="say"></div>
<div class="note" id="note" hidden role="dialog" aria-live="polite"></div>
<div class="load" id="load"><span>unfolding the mat…</span></div>

<script src="three.min.js"></script>
<script>
(()=>{
const $=s=>document.querySelector(s);
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const EMBED=/(^|\.)github\.io$|^localhost$|^127\./.test(location.hostname);
const noteEl=$('#note'),tipEl=$('#tip'),sayEl=$('#say'),hint=$('#hint');
if(!window.THREE){$('#load').innerHTML='<span>the mat needs WebGL. <a href="./">go back ↩</a></span>';return}
const T=THREE;

/* ---------------- renderer, scene, camera ---------------- */
const cv=$('#gl');
let R;try{R=new T.WebGLRenderer({canvas:cv,antialias:true})}catch(e){$('#load').innerHTML='<span>the mat needs WebGL. <a href="./">go back ↩</a></span>';return}
R.setPixelRatio(Math.min(devicePixelRatio,2));R.outputEncoding=T.sRGBEncoding;R.toneMapping=T.ACESFilmicToneMapping;R.toneMappingExposure=1.05;
R.shadowMap.enabled=true;R.shadowMap.type=T.PCFSoftShadowMap;
const S=new T.Scene();
const HORIZON=new T.Color('#d9ead8'),ZENITH=new T.Color('#4f93dc');
S.fog=new T.Fog(HORIZON,14,46);
const cam=new T.PerspectiveCamera(38,1,.1,200);
const LOOK=new T.Vector3(0,.55,-1.2),LOOKD=new T.Vector3(0,.55,-1.2),LOOKM=new T.Vector3(0,.5,-.9);
const mobile=()=>innerWidth/innerHeight<.9;
const tex=(c,srgb=true)=>{const t=new T.CanvasTexture(c);if(srgb)t.encoding=T.sRGBEncoding;t.anisotropy=R.capabilities.getMaxAnisotropy();return t};
const canvas=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return[c,c.getContext('2d')]};
const rnd=(a,b)=>a+Math.random()*(b-a);

/* ---------------- sky + sun ---------------- */
const SUN=new T.Vector3(.55,.62,-.56).normalize();const SUNV=new T.Vector3(.5,.3,-.81).normalize();
const sky=new T.Mesh(new T.SphereGeometry(90,32,16),new T.ShaderMaterial({side:T.BackSide,depthWrite:false,fog:false,
  uniforms:{zen:{value:ZENITH},hor:{value:HORIZON},sun:{value:SUNV}},
  vertexShader:`varying vec3 vD;void main(){vD=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`uniform vec3 zen,hor,sun;varying vec3 vD;void main(){float y=max(vD.y,0.);vec3 c=mix(hor,zen,pow(y,.55));
    float d=max(dot(vD,sun),0.);c+=vec3(1.,.93,.75)*(smoothstep(.9990,.9994,d)*5.+pow(d,60.)*.6+pow(d,8.)*.22);gl_FragColor=vec4(c,1.);}`}));
S.add(sky);
// clouds
const [cc,cx]=canvas(256,128);{for(let i=0;i<26;i++){const x=rnd(50,206),y=rnd(50,86),r=rnd(18,40);const g=cx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'rgba(255,255,255,.85)');g.addColorStop(1,'rgba(255,255,255,0)');cx.fillStyle=g;cx.fillRect(0,0,256,128)}}
const cloudTex=tex(cc);const clouds=[];
for(let i=0;i<7;i++){const s=new T.Sprite(new T.SpriteMaterial({map:cloudTex,transparent:true,opacity:rnd(.55,.9),fog:false,depthWrite:false}));s.scale.set(rnd(14,24),rnd(6,9),1);s.position.set(rnd(-40,40),rnd(12,22),rnd(-70,-50));S.add(s);clouds.push(s)}

const [rc,rx]=canvas(512,512);{rx.translate(256,256);for(let i=0;i<24;i++){rx.rotate(Math.PI/12);const g=rx.createLinearGradient(0,0,250,0);g.addColorStop(0,'rgba(255,240,200,.35)');g.addColorStop(1,'rgba(255,240,200,0)');rx.fillStyle=g;rx.beginPath();rx.moveTo(0,0);rx.lineTo(250,i%2?-10:-18);rx.lineTo(250,i%2?10:18);rx.fill()}}
const rays=new T.Sprite(new T.SpriteMaterial({map:tex(rc),transparent:true,depthWrite:false,fog:false,blending:T.AdditiveBlending,opacity:.55}));rays.scale.set(26,26,1);rays.position.copy(SUNV).multiplyScalar(80);S.add(rays);
/* ---------------- lights ---------------- */
S.add(new T.HemisphereLight('#cfe5ff','#5b7a33',.75));
const sunL=new T.DirectionalLight('#fff1d6',2.1);sunL.position.copy(SUN).multiplyScalar(14);sunL.castShadow=true;
sunL.shadow.mapSize.set(2048,2048);const sc=sunL.shadow.camera;sc.left=-5;sc.right=5;sc.top=5;sc.bottom=-5;sc.near=1;sc.far=40;sunL.shadow.bias=-.0006;sunL.shadow.normalBias=.02;
S.add(sunL);S.add(sunL.target);

/* ---------------- ground + grass ---------------- */
const [gc,gx]=canvas(512,512);gx.fillStyle='#577f2f';gx.fillRect(0,0,512,512);
for(let i=0;i<9000;i++){const v=rnd(-24,24);gx.fillStyle=`rgb(${80+v},${118+v*1.3},${40+v*.5})`;gx.fillRect(rnd(0,512),rnd(0,512),rnd(1,3),rnd(2,7))}
for(let i=0;i<40;i++){gx.fillStyle='rgba(120,100,50,.12)';gx.beginPath();gx.ellipse(rnd(0,512),rnd(0,512),rnd(10,40),rnd(6,20),rnd(0,3),0,7);gx.fill()}
const gTex=tex(gc);gTex.wrapS=gTex.wrapT=T.RepeatWrapping;gTex.repeat.set(26,26);
const ground=new T.Mesh(new T.PlaneGeometry(120,120),new T.MeshLambertMaterial({map:gTex}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;S.add(ground);

const U={time:{value:0},gust:{value:.6}};
const MAT_W=3.4,MAT_D=2.5;
function grass(){
  const H=.15,geo=new T.PlaneGeometry(.04,H,1,4);geo.translate(0,H/2,0);
  const p=geo.attributes.position;for(let i=0;i<p.count;i++){const y=p.getY(i)/H;p.setX(i,p.getX(i)*(1-y*.92));p.setZ(i,y*y*.05)}
  const mat=new T.MeshLambertMaterial({side:T.DoubleSide});
  mat.onBeforeCompile=sh=>{sh.uniforms.time=U.time;sh.uniforms.gust=U.gust;
    sh.vertexShader='uniform float time;uniform float gust;varying float vH;\n'+sh.vertexShader.replace('#include <begin_vertex>',`#include <begin_vertex>
      vH=position.y/${H.toFixed(3)};
      vec4 wp=instanceMatrix*vec4(0.,0.,0.,1.);
      float wave=sin(time*1.6-wp.x*.55+wp.z*.35)*.5+.5;
      float flut=sin(time*5.3+wp.x*7.1+wp.z*3.7)*.15;
      float bend=(gust*(.35+.85*wave)+flut)*vH*vH;
      transformed.x+=bend*.16;transformed.y-=abs(bend)*.03;`);
    sh.fragmentShader='varying float vH;\n'+sh.fragmentShader.replace('#include <color_fragment>','#include <color_fragment>\n diffuseColor.rgb*=mix(.38,1.08,vH);')};
  const N=mobile()?18000:42000;const m=new T.InstancedMesh(geo,mat,N);const d=new T.Object3D(),col=new T.Color();let n=0;
  while(n<N){const near=n<N*.62;const x=near?rnd(-6,6):rnd(-22,22),z=near?rnd(-5,4.5):rnd(-26,6);
    if(Math.abs(x)<MAT_W/2+.02&&Math.abs(z-.0)<MAT_D/2+.02)continue;
    d.position.set(x,0,z);d.rotation.set(rnd(-.12,.12),rnd(-.5,.5),rnd(-.15,.15));const s=rnd(.55,1.35)*(near?1:1.6);d.scale.set(s,s*rnd(.8,1.3),s);d.updateMatrix();m.setMatrixAt(n,d.matrix);
    col.setHSL(rnd(.2,.27),rnd(.45,.65),rnd(.28,.42));if(Math.random()<.05)col.setHSL(.13,.5,.5);m.setColorAt(n,col);n++}
  m.instanceMatrix.needsUpdate=true;S.add(m)}
grass();
// little white flowers in the grass
{const g=new T.SphereGeometry(.025,6,4),mt=new T.MeshLambertMaterial({color:'#fffdf2'}),N=260,m=new T.InstancedMesh(g,mt,N),d=new T.Object3D();let n=0;
  while(n<N){const x=rnd(-7,7),z=rnd(-6,4);if(Math.abs(x)<MAT_W/2+.1&&Math.abs(z)<MAT_D/2+.1)continue;d.position.set(x,rnd(.1,.2),z);d.scale.set(1,.5,1);d.updateMatrix();m.setMatrixAt(n++,d.matrix)}S.add(m)}

/* ---------------- distant trees ---------------- */
function treeTex(seed){const [c,x]=canvas(256,256);const blobs=200;x.fillStyle='#4a3a26';x.fillRect(122,150,12,106);
  for(let i=0;i<blobs;i++){const a=rnd(0,6.28),r=Math.sqrt(Math.random())*84,bx=128+Math.cos(a)*r,by=112+Math.sin(a)*r*.78,br=rnd(9,20);const sh=(by-40)/150;const v=rnd(-12,12)-sh*26;x.fillStyle=`rgb(${62+v},${96+v},${44+v*.6})`;x.beginPath();x.arc(bx,by,br,0,7);x.fill();
    x.fillStyle=`rgba(255,240,180,${rnd(.04,.12)})`;x.beginPath();x.arc(bx+br*.3,by-br*.3,br*.6,0,7);x.fill()}return tex(c)}
const TT=[treeTex(),treeTex(),treeTex()];
for(let i=0;i<40;i++){const s=new T.Sprite(new T.SpriteMaterial({map:TT[i%3],transparent:true,alphaTest:.4}));const h=rnd(3.2,5.4);s.scale.set(h,h,1);s.position.set(rnd(-40,40),h*.45,rnd(-42,-30));S.add(s)}

/* ---------------- dappled shade: an invisible canopy that only casts shadows ---------------- */
const [lc,lx]=canvas(512,512);lx.fillStyle='#000';
for(let i=0;i<420;i++){const x=rnd(0,512),y=rnd(0,512),r=rnd(8,26);lx.beginPath();lx.ellipse(x,y,r,r*rnd(.5,1),rnd(0,3),0,7);lx.fill()}
const leafTex=tex(lc,false);
const canopy=new T.Mesh(new T.PlaneGeometry(6,6),new T.MeshBasicMaterial({map:leafTex,transparent:true,alphaTest:.5,colorWrite:false,depthWrite:false}));
canopy.customDepthMaterial=new T.MeshDepthMaterial({depthPacking:T.RGBADepthPacking,map:leafTex,alphaTest:.5});
canopy.material.alphaMap=leafTex;canopy.customDepthMaterial.alphaMap=leafTex;
canopy.rotation.x=-Math.PI/2;canopy.position.set(-3.3,4.2,-1.4);canopy.castShadow=true;S.add(canopy);

/* ---------------- the picnic mat ---------------- */
const [mc,mx]=canvas(1024,768);
mx.fillStyle='#fbf3e3';mx.fillRect(0,0,1024,768);const sq=64;
for(let y=0;y<768;y+=sq)for(let x=0;x<1024;x+=sq){const i=(x/sq)%2,j=(y/sq)%2;const a=i&&j?.95:(i||j?.5:0);if(a){mx.fillStyle=`rgba(196,38,40,${a})`;mx.fillRect(x,y,sq,sq)}}
for(let y=0;y<768;y+=3){mx.fillStyle=`rgba(0,0,0,${Math.random()*.05})`;mx.fillRect(0,y,1024,1)}
for(let x=0;x<1024;x+=3){mx.fillStyle=`rgba(255,255,255,${Math.random()*.05})`;mx.fillRect(x,0,1,768)}
for(let i=0;i<14000;i++){mx.fillStyle=Math.random()<.5?'rgba(0,0,0,.06)':'rgba(255,255,255,.06)';mx.fillRect(rnd(0,1024),rnd(0,768),1,1)}
mx.strokeStyle='rgba(120,20,20,.55)';mx.lineWidth=10;mx.setLineDash([14,8]);mx.strokeRect(14,14,996,740);
const matGeo=new T.PlaneGeometry(MAT_W,MAT_D,48,36);matGeo.rotateX(-Math.PI/2);
const mp=matGeo.attributes.position,base=Float32Array.from(mp.array);
for(let i=0;i<mp.count;i++){const x=base[i*3],z=base[i*3+2];base[i*3+1]=.012+Math.max(0,Math.sin(x*5.1+z*2.3)*Math.sin(z*6.7-x)*.012)}
const mat=new T.Mesh(matGeo,new T.MeshStandardMaterial({map:tex(mc),roughness:.92,metalness:0,side:T.DoubleSide}));
mat.receiveShadow=true;mat.castShadow=true;S.add(mat);
// corners that lift in the wind (the back-right one most, nobody is sitting on it)
const CORN=[[MAT_W/2,-MAT_D/2,1],[MAT_W/2,MAT_D/2,.75],[-MAT_W/2,MAT_D/2,.45],[-MAT_W/2,-MAT_D/2,.2]];
function flapMat(t,g){for(let i=0;i<mp.count;i++){const x=base[i*3],z=base[i*3+2];let y=base[i*3+1];
    for(const [cx2,cz,k] of CORN){const d=Math.hypot(x-cx2,z-cz);if(d<.75){const f=1-d/.75;y+=f*f*k*g*(.09+.05*Math.sin(t*6.5+x*4+z*3))}}
    y+=Math.sin(t*2.2+x*2.5+z*1.7)*.004*g;mp.array[i*3+1]=y}
  mp.needsUpdate=true;matGeo.computeVertexNormals()}

/* ---------------- characters (sprites cut from Krishna's sheet) ---------------- */
const loader=new T.TextureLoader();
const IMG=n=>new Promise(res=>loader.load(n,t=>{t.encoding=T.sRGBEncoding;t.anisotropy=8;res(t)},undefined,()=>res(null)));
function cutout(t,h){const a=t.image.width/t.image.height;const g=new T.PlaneGeometry(h*a,h);g.translate(0,h/2,0);
  const m=new T.Mesh(g,new T.MeshStandardMaterial({map:t,transparent:true,alphaTest:.45,roughness:1,side:T.DoubleSide}));
  m.customDepthMaterial=new T.MeshDepthMaterial({depthPacking:T.RGBADepthPacking,map:t,alphaTest:.45});m.castShadow=true;return m}

/* ---------------- things on the mat ---------------- */
const pick=[];const add=(o,key,label)=>{o.traverse(c=>{if(c.isMesh){c.castShadow=true;c.receiveShadow=true;c.userData.key=key}});o.userData.key=key;o.userData.label=label;pick.push(o);S.add(o);return o};
const std=(c,r=.7,m=0)=>new T.MeshStandardMaterial({color:c,roughness:r,metalness:m});
function roundRect(w,h,r){const s=new T.Shape();s.moveTo(-w/2+r,-h/2);s.lineTo(w/2-r,-h/2);s.quadraticCurveTo(w/2,-h/2,w/2,-h/2+r);s.lineTo(w/2,h/2-r);s.quadraticCurveTo(w/2,h/2,w/2-r,h/2);s.lineTo(-w/2+r,h/2);s.quadraticCurveTo(-w/2,h/2,-w/2,h/2-r);s.lineTo(-w/2,-h/2+r);s.quadraticCurveTo(-w/2,-h/2,-w/2+r,-h/2);return s}
function fabric(col){const [c,x]=canvas(256,256);x.fillStyle=col;x.fillRect(0,0,256,256);for(let i=0;i<256;i+=2){x.fillStyle=`rgba(0,0,0,${Math.random()*.08})`;x.fillRect(0,i,256,1);x.fillStyle=`rgba(255,255,255,${Math.random()*.05})`;x.fillRect(i,0,1,256)}const t=tex(c);t.wrapS=t.wrapT=T.RepeatWrapping;return t}

// her olive backpack (painted from her description: olive, fold-top, side bottle pocket)

  const src=actx.createBufferSource();src.buffer=buf;src.loop=true;const f=actx.createBiquadFilter();f.type='lowpass';f.frequency.value=600;windG=actx.createGain();windG.gain.value=0;src.connect(f).connect(windG).connect(actx.destination);src.start()}

cv.addEventListener('pointermove',e=>{ptrPx.x=e.clientX;ptrPx.y=e.clientY;const h=hit(e);hovered=h;cv.style.cursor=h?'pointer':'default';
  const lab=h&&(h.key==='balloon'?'pop me':h.key==='k'?'Krishna':(pick.find(p=>p.userData.key===h.key)||{}).userData?.label||SPOTS.find(s=>s.key===h.key)?.label);
  if(lab&&e.pointerType==='mouse'){tipEl.textContent=lab;tipEl.style.left=e.clientX+'px';tipEl.style.top=e.clientY+'px';tipEl.classList.add('on')}else tipEl.classList.remove('on')});
cv.addEventListener('pointerleave',()=>tipEl.classList.remove('on'));
let down=null;cv.addEventListener('pointerdown',e=>down={x:e.clientX,y:e.clientY});
cv.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down.x,e.clientY-down.y)>8)return;down=null;const h=hit(e);if(!h){noteEl.hidden=true;return}if(!arrived&&h.key!=='balloon'){arrive()}const f=ACT[h.key];f&&f(h.o)});

/* ---------------- layout ---------------- */
function size(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;const m=mobile();cam.fov=m?60:42;cam.updateProjectionMatrix();camBase.set(0,m?2.6:2.25,m?5.7:6.2);LOOK.copy(m?LOOKM:LOOKD);
  // park the sun just inside the top-right of whatever this screen can see
  const pitch=Math.atan2(camBase.y-LOOK.y,camBase.z-LOOK.z),half=cam.fov/2*Math.PI/180,hf=Math.atan(Math.tan(half)*cam.aspect);
  const el=Math.max(.06,half-pitch-.09),az=Math.min(.4,hf*.62);SUNV.set(Math.sin(az)*Math.cos(el),Math.sin(el),-Math.cos(az)*Math.cos(el));rays.position.copy(SUNV).multiplyScalar(80)}
const camBase=new T.Vector3();addEventListener('resize',size);size();cam.position.copy(camBase);cam.lookAt(LOOK);
let px=0,py=0;addEventListener('pointermove',e=>{px=e.clientX/innerWidth-.5;py=e.clientY/innerHeight-.5},{passive:true});

/* ---------------- loop ---------------- */
const clock=new T.Clock();const tmp=new T.Vector3(),proj=new T.Vector3();let gust=.6,bt=0;
function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime*(RM?.35:1);
  // wind: slow swell plus random gusts
  const target=.55+.35*Math.sin(t*.37)+.25*Math.max(0,Math.sin(t*1.13+Math.sin(t*.3)*2));gust+=(target-gust)*.02;U.time.value=t;U.gust.value=gust;
  if(windG)windG.gain.value=SND?.05+gust*.09:0;
  cam.position.lerp(tmp.copy(camBase).add(new T.Vector3(px*.8,-py*.35,0)),.05);cam.lookAt(LOOK);
  flapMat(t,gust);
  canopy.position.x=-3.3+Math.sin(t*.8)*.06*gust;canopy.rotation.z=Math.sin(t*.6)*.02*gust;
  clouds.forEach((c,i)=>{c.position.x+=dt*(.25+i*.04);if(c.position.x>48)c.position.x=-48});
  fly.forEach(f=>{const u=f.userData;f.position.x+=dt*(.5+gust*1.4)*u.s;f.position.y+=Math.sin(t*2+u.s*9)*dt*.25;f.position.z+=Math.sin(t*.7+u.s*5)*dt*.2;f.rotation.x+=dt*u.r.x;f.rotation.y+=dt*u.r.y;
    if(f.position.x>9||f.position.y<.02){f.position.set(-9,rnd(.3,3),rnd(-6,3))}});
  // Krishna walks in with her balloons, then sits
  if(K.tex.walk){const ks=K.tex[K.pose];
    if(!arrived&&K.pose==='walk'){K.x+=dt*.85;const s=K.tex.walk;s.position.set(K.x,Math.abs(Math.sin(t*6))*.03,KPOS.z+.15);if(K.x>=KPOS.x-.15)arrive()}
    else if(ks){ks.position.copy(KPOS)}
    Object.values(K.tex).forEach(m=>m&&(m.rotation.y=Math.atan2(cam.position.x-m.position.x,cam.position.z-m.position.z)*.6))}
  // balloons on strings, tied next to her
  tie.set(bag.position.x-.02,.72,bag.position.z+.02);
  balloons.forEach((b,i)=>{if(!b.visible)return;const u=b.userData;
    if(u.free){u.v.y+=dt*.6;u.v.x+=dt*gust*.4;b.position.addScaledVector(u.v,dt);if(b.position.y>30){b.visible=false;b.position.set(0,-5,0);u.v.set(0,0,0)}return}
    const home=tmp.copy(tie).add(u.home);home.x+=gust*.35*Math.sin(t*.9+u.ph)+gust*.25;home.z+=Math.cos(t*.7+u.ph)*.08;
    u.v.addScaledVector(home.sub(b.position),dt*6);u.v.multiplyScalar(.94);b.position.addScaledVector(u.v,dt);b.rotation.z=-u.v.x*.4;
    const p=u.str.geometry.attributes.position;p.setXYZ(0,tie.x,tie.y,tie.z);p.setXYZ(1,b.position.x,b.position.y-.17,b.position.z);p.needsUpdate=true;u.str.geometry.computeBoundingSphere()});
  // steam
  steam.forEach(s=>{const u=s.userData;u.t+=dt*.35*steamBoost;if(u.t>1)u.t=0;const cup=chai.children[u.cup?4:2];cup.getWorldPosition(tmp);s.position.set(tmp.x+u.t*gust*.25,tmp.y+.1+u.t*.5,tmp.z);const k=u.t;s.material.opacity=Math.sin(k*Math.PI)*.35;s.scale.setScalar(.06+k*.18)});
  steamBoost+=(1-steamBoost)*.01;
  cans.children.forEach(g=>{if(g.userData.wob){g.userData.wob*=.94;g.rotation.z=Math.sin(t*22)*.18*g.userData.wob;if(g.userData.wob<.01){g.userData.wob=0;g.rotation.z=0}}});
  bumps=bumps.filter(b=>{b.t+=dt*3;b.o.scale.setScalar(1+Math.sin(Math.min(b.t,1)*Math.PI)*.12);return b.t<1});
  if(sayTarget){sayTarget.getWorldPosition(proj);proj.y+=sayTarget===K.tex[K.pose]?(K.pose==='sit'?1.05:K.pose==='read'?1.1:1.95):.55;proj.project(cam);sayEl.style.left=((proj.x+1)/2*innerWidth)+'px';sayEl.style.top=((1-proj.y)/2*innerHeight)+'px'}
  R.render(S,cam)}
frame();
setTimeout(()=>hint.classList.add('off'),9000);
})();
</script>
