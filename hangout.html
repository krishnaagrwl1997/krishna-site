<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hangout with K</title>
<meta name="description" content="A picnic mat in the sun. Pour some chai, take a photo, steal a charger.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Instrument+Sans:wght@500;600;700&display=swap">
<style>
:root{--ink:#1d1a16;--paper:#fbf7ee;--red:#c8322b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#cfe0ea;overflow:hidden;font:500 15px/1.4 "Instrument Sans",system-ui,-apple-system,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c.drag{cursor:grabbing}#c.hot{cursor:pointer}
.ui{position:fixed;z-index:5;pointer-events:none}
.top{left:16px;right:16px;top:calc(14px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pill{pointer-events:auto;display:inline-flex;align-items:center;gap:8px;background:var(--paper);color:var(--ink);border:0;border-radius:999px;padding:9px 14px;font:700 13px/1 "Instrument Sans",sans-serif;letter-spacing:.02em;box-shadow:0 6px 18px #0002;text-decoration:none;cursor:pointer}
.pill b{color:var(--red)}
.pill:focus-visible,.chip:focus-visible{outline:3px solid #2438d8;outline-offset:2px}
.title{font:700 26px/1 Caveat,cursive;letter-spacing:0;padding:8px 16px 10px}
.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.bottom{left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;justify-items:center}
.hint{font:700 22px/1 Caveat,cursive;color:#fff;text-shadow:0 2px 8px #0008;transition:opacity .6s}
.chips{pointer-events:auto;display:flex;gap:6px;overflow-x:auto;max-width:100%;padding:4px 2px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;border-radius:999px;background:#ffffffe6;padding:8px 12px;font:600 13px/1 "Instrument Sans",sans-serif;color:var(--ink);cursor:pointer;box-shadow:0 4px 12px #0002;backdrop-filter:blur(6px)}
.chip:hover{background:#fff}
.bub{position:fixed;z-index:6;left:0;top:0;pointer-events:none;max-width:min(240px,70vw);background:#fff;color:var(--ink);padding:9px 13px 10px;border-radius:16px;font:600 15px/1.3 "Instrument Sans",sans-serif;box-shadow:0 10px 24px #0003;transform:translate(-50%,calc(-100% - 14px)) scale(.6);opacity:0;transition:opacity .2s,transform .3s cubic-bezier(.3,1.6,.5,1)}
.bub.on{opacity:1;transform:translate(-50%,calc(-100% - 14px)) scale(1)}
.bub::after{content:"";position:absolute;left:50%;bottom:-7px;width:14px;height:14px;background:#fff;transform:translateX(-50%) rotate(45deg);border-radius:2px}
.bub small{display:block;font:700 10px/1 "Instrument Sans";letter-spacing:.12em;text-transform:uppercase;color:var(--red);margin-bottom:4px}
.tip{position:fixed;z-index:6;left:0;top:0;pointer-events:none;background:var(--ink);color:#fff;padding:6px 10px;border-radius:8px;font:600 13px/1.2 "Instrument Sans";white-space:nowrap;transform:translate(14px,14px);opacity:0;transition:opacity .15s}
.tip.on{opacity:1}
.load{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#f3ead8;font:700 30px/1.1 Caveat,cursive;color:var(--ink);transition:opacity .8s;text-align:center}
.load.done{opacity:0;pointer-events:none}
.load i{display:block;font:600 13px/1 "Instrument Sans";color:#7a705f;margin-top:10px;font-style:normal}
.flash{position:fixed;inset:0;z-index:4;background:#fff;opacity:0;pointer-events:none}.flash.on{animation:flash .5s ease-out}@keyframes flash{0%{opacity:.85}100%{opacity:0}}
.shade{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity .6s;background:radial-gradient(ellipse 75% 70% at 50% 50%,rgba(70,40,0,.22),rgba(25,12,0,.6));}.shade.on{opacity:1}
.nogl{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;background:#f3ead8;font:600 18px/1.4 "Instrument Sans"}
@media (max-width:640px){.title{font-size:22px}.hint{font-size:19px}}
@media (prefers-reduced-motion:reduce){.bub{transition:none}}
</style></head><body>
<canvas id="c" aria-label="A 3D picnic on a gingham mat with chai, an instant camera, a speaker, snacks and more. Use the buttons at the bottom to interact."></canvas>
<div class="ui top">
  <a class="pill" href="index.html" id="back" aria-label="Back to Krishna's Secret Files">← K’s files</a>
  <div class="btns"><button class="pill" id="tod" type="button">☀︎ afternoon</button><button class="pill" id="snd" type="button" aria-pressed="false">🔈 sound off</button></div>
</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
if(!window.THREE){document.body.insertAdjacentHTML('beforeend','<div class="nogl">The picnic needs a little 3D engine that didn’t load. Try refreshing?</div>');return}
document.getElementById('back').addEventListener('click',e=>{if(document.referrer&&history.length>1){e.preventDefault();history.back()}});
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const MOB=Math.min(innerWidth,innerHeight)<700;
const $=s=>document.querySelector(s);
const cv=$('#c');
let R;try{R=new THREE.WebGLRenderer({canvas:cv,antialias:true,powerPreference:'high-performance'})}catch(e){document.body.insertAdjacentHTML('beforeend','<div class="nogl">Your browser can’t draw the 3D picnic. It’s a sunny one though, promise ☀︎</div>');return}
R.setPixelRatio(Math.min(devicePixelRatio||1,MOB?1.6:2));
R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
R.outputEncoding=THREE.sRGBEncoding;R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.05;
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(42,1,.05,200);
const ANISO=R.capabilities.getMaxAnisotropy();

/* ---------------- small helpers ---------------- */
const canvas=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const tex=(c,rep,srgb=true)=>{const t=new THREE.CanvasTexture(c);t.anisotropy=ANISO;if(srgb)t.encoding=THREE.sRGBEncoding;if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep[0],rep[1])}return t};
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
// value noise
const P=new Uint8Array(512);for(let i=0;i<256;i++)P[i]=i;for(let i=255;i>0;i--){const j=(rnd()*(i+1))|0;[P[i],P[j]]=[P[j],P[i]]}for(let i=0;i<256;i++)P[i+256]=P[i];
const fade=t=>t*t*(3-2*t);const hsh=(x,y)=>P[P[x&255]+(y&255)]/255;
function noise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;const a=hsh(xi,yi),b=hsh(xi+1,yi),c=hsh(xi,yi+1),d=hsh(xi+1,yi+1);const u=fade(xf),v=fade(yf);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
const fbm=(x,y,o=4)=>{let s=0,a=.5,f=1;for(let i=0;i<o;i++){s+=a*noise(x*f,y*f);a*=.5;f*=2}return s};
// height field (Float32 w*h, 0..1) -> normal map canvas
function normalMap(H,w,h,str){const c=canvas(w,h),x=c.getContext('2d'),im=x.createImageData(w,h);
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){const l=H[j*w+(i-1+w)%w],r=H[j*w+(i+1)%w],u=H[((j-1+h)%h)*w+i],d=H[((j+1)%h)*w+i];
    let nx=(l-r)*str,ny=(u-d)*str,nz=1;const n=Math.hypot(nx,ny,nz);const k=(j*w+i)*4;im.data[k]=(nx/n*.5+.5)*255;im.data[k+1]=(ny/n*.5+.5)*255;im.data[k+2]=(nz/n*.5+.5)*255;im.data[k+3]=255}
  x.putImageData(im,0,0);return c}
function roundedBox(w,h,d,r,s=6){const g=new THREE.BoxGeometry(w,h,d,s,s,s),p=g.attributes.position,v=new THREE.Vector3(),hw=w/2-r,hh=h/2-r,hd=d/2-r;
  for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i);const ix=Math.max(-hw,Math.min(hw,v.x)),iy=Math.max(-hh,Math.min(hh,v.y)),iz=Math.max(-hd,Math.min(hd,v.z));
    const dx=v.x-ix,dy=v.y-iy,dz=v.z-iz,l=Math.hypot(dx,dy,dz)||1;p.setXYZ(i,ix+dx/l*r,iy+dy/l*r,iz+dz/l*r)}
  g.computeVertexNormals();return g}
const U={time:{value:0},wind:{value:0}};

/* ---------------- sky, sun, light ---------------- */
const sky=new THREE.Mesh(new THREE.SphereGeometry(90,48,24),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,
  uniforms:{top:{value:new THREE.Color()},hor:{value:new THREE.Color()},sunC:{value:new THREE.Color()},sunD:{value:new THREE.Vector3()}},
  vertexShader:'varying vec3 vD;void main(){vD=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:`uniform vec3 top,hor,sunC,sunD;varying vec3 vD;void main(){float y=max(vD.y,0.);vec3 c=mix(hor,top,pow(y,.55));
    float s=max(dot(normalize(vD),normalize(sunD)),0.);c+=sunC*(pow(s,900.)*6.+pow(s,60.)*.5+pow(s,6.)*.18);
    c=mix(c,hor*.95,smoothstep(.0,-.12,vD.y));gl_FragColor=vec4(c,1.);}`}));
scene.add(sky);
const hemi=new THREE.HemisphereLight(0xcfe6ff,0x5d7a35,.55);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff0d4,2.4);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);sun.shadow.radius=3;Object.assign(sun.shadow.camera,{left:-1.7,right:1.7,top:1.7,bottom:-1.7,near:.5,far:20});
sun.shadow.bias=-.0004;sun.shadow.normalBias=.015;scene.add(sun);scene.add(sun.target);
scene.fog=new THREE.Fog(0xdfe8e0,12,60);
const TOD={
 afternoon:{l:'☀︎ afternoon',dir:[2.6,4.6,-3.4],vis:[.42,.11,-1],col:0xfff1d8,int:1.75,hemi:.42,top:0x2f78d0,hor:0xc4dcee,sunC:0xfff1cc,fog:0xc9dbe6,exp:.92},
 golden:{l:'☀︎ golden hour',dir:[5,2.3,-3.5],vis:[.6,.07,-1],col:0xffc27a,int:1.7,hemi:.32,top:0x4f7fc4,hor:0xffd29a,sunC:0xffc070,fog:0xf0d8b8,exp:.95},
 sunset:{l:'☀︎ sunset',dir:[7,1.1,-3],vis:[.5,.035,-1],col:0xff8d52,int:1.3,hemi:.26,top:0x46558f,hor:0xff9a6a,sunC:0xff7b45,fog:0xd59a86,exp:1}};
const TODK=Object.keys(TOD);let tod='afternoon';
function setTod(k){tod=k;const t=TOD[k];sun.position.set(...t.dir);sun.color.set(t.col);sun.intensity=t.int;hemi.intensity=t.hemi;
  sky.material.uniforms.top.value.set(t.top);sky.material.uniforms.hor.value.set(t.hor);sky.material.uniforms.sunC.value.set(t.sunC);sky.material.uniforms.sunD.value.set(...t.vis);
  scene.fog.color.set(t.fog);R.toneMappingExposure=t.exp;$('#tod').textContent=t.l;
  const tint=new THREE.Color(0xffffff).lerp(new THREE.Color(t.col),.22);if(env)makeEnv()}
// environment for reflections on the cans, built from the sky itself
let env=null;const pmrem=new THREE.PMREMGenerator(R);
function makeEnv(){const t=TOD[tod],c=canvas(512,256),x=c.getContext('2d'),g=x.createLinearGradient(0,0,0,256);
  const hx=n=>'#'+new THREE.Color(n).getHexString();g.addColorStop(0,hx(t.top));g.addColorStop(.48,hx(t.hor));g.addColorStop(.52,'#6f8a4a');g.addColorStop(1,'#3f5a2a');x.fillStyle=g;x.fillRect(0,0,512,256);
  const sx=(Math.atan2(t.dir[0],t.dir[2])/(2*Math.PI)+.5)*512,sy=(.5-Math.asin(t.dir[1]/Math.hypot(...t.dir))/Math.PI)*256,sg=x.createRadialGradient(sx,sy,0,sx,sy,40);sg.addColorStop(0,'#fff');sg.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=sg;x.fillRect(0,0,512,256);
  const e=new THREE.CanvasTexture(c);e.mapping=THREE.EquirectangularReflectionMapping;e.encoding=THREE.sRGBEncoding;
  if(env)env.dispose();env=pmrem.fromEquirectangular(e).texture;e.dispose();scene.environment=env}

/* ---------------- ground + treeline ---------------- */
{const c=canvas(512,512),x=c.getContext('2d'),im=x.createImageData(512,512);
  for(let j=0;j<512;j++)for(let i=0;i<512;i++){const n=fbm(i/40,j/40),m=noise(i/3,j/3);const k=(j*512+i)*4;
    im.data[k]=40+n*34+m*14;im.data[k+1]=68+n*46+m*18;im.data[k+2]=22+n*14;im.data[k+3]=255}
  x.putImageData(im,0,0);
  const g=new THREE.Mesh(new THREE.PlaneGeometry(160,160),new THREE.MeshStandardMaterial({map:tex(c,[90,90]),roughness:1}));g.rotation.x=-Math.PI/2;g.receiveShadow=true;scene.add(g)}
{const c=canvas(2048,256),x=c.getContext('2d');
  for(let layer=0;layer<3;layer++){x.fillStyle=['#a9bcc0','#8ea79f','#77937f'][layer];x.beginPath();x.moveTo(0,256);
    for(let i=0;i<=2048;i+=6){const h=60+layer*28+fbm(i/90+layer*9,layer*3,4)*120+Math.max(0,Math.sin(i/37+layer))*14;x.lineTo(i,256-h)}x.lineTo(2048,256);x.fill()}
  const t=tex(c);t.wrapS=THREE.RepeatWrapping;t.repeat.x=3;
  const ring=new THREE.Mesh(new THREE.CylinderGeometry(34,34,4.2,64,1,true),new THREE.MeshBasicMaterial({map:t,transparent:true,side:THREE.BackSide,fog:true,depthWrite:false}));ring.position.y=1.6;scene.add(ring)}
// clouds
const clouds=[];{const c=canvas(256,128),x=c.getContext('2d');for(let i=0;i<26;i++){const g=x.createRadialGradient(0,0,0,0,0,1);g.addColorStop(0,'rgba(255,255,255,.9)');g.addColorStop(1,'rgba(255,255,255,0)');x.save();x.translate(40+rnd()*176,60+rnd()*30);x.scale(20+rnd()*30,14+rnd()*16);x.fillStyle=g;x.beginPath();x.arc(0,0,1,0,7);x.fill();x.restore()}
  const t=tex(c);for(let i=0;i<7;i++){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,opacity:.85,fog:false,depthWrite:false}));const a=-1.9+rnd()*2.2;s.position.set(Math.sin(a)*70,9+rnd()*14,-Math.cos(a)*70);s.scale.set(24+rnd()*18,9+rnd()*6,1);s.userData.v=.15+rnd()*.25;scene.add(s);clouds.push(s)}}

/* ---------------- grass: instanced blades that bend in the wind ---------------- */
const MAT={w:2.4,d:1.7};
{const bg=new THREE.PlaneGeometry(1,1,1,4);bg.translate(0,.5,0);const p=bg.attributes.position;for(let i=0;i<p.count;i++){const y=p.getY(i);p.setX(i,p.getX(i)*(1-y*.92));}
  const nr=bg.attributes.normal;for(let i=0;i<nr.count;i++)nr.setXYZ(i,0,1,0);
  const m=new THREE.MeshStandardMaterial({roughness:.85,side:THREE.DoubleSide});
  m.onBeforeCompile=s=>{s.uniforms.uTime=U.time;s.uniforms.uWind=U.wind;s.vertexShader='uniform float uTime;uniform float uWind;\n'+s.vertexShader.replace('#include <project_vertex>',`
    vec4 wp=instanceMatrix*vec4(transformed,1.);float hgt=length(instanceMatrix[1].xyz);float b=position.y*position.y;
    float ph=uTime*1.7+wp.x*1.2+wp.z*.8;float sw=sin(ph)*.18+sin(ph*2.7+1.3)*.07+uWind*(.7+.25*sin(uTime*6.+wp.x*5.+wp.z*3.));
    wp.x+=sw*b*hgt;wp.z+=sin(ph*.7)*.06*b*hgt;wp.y-=abs(sw)*b*hgt*.25;
    vec4 mvPosition=modelViewMatrix*wp;gl_Position=projectionMatrix*mvPosition;`)};
  const N=MOB?22000:60000;const im=new THREE.InstancedMesh(bg,m,N);im.receiveShadow=true;
  const o=new THREE.Object3D(),col=new THREE.Color();let n=0;
  while(n<N){const x=(rnd()*2-1)*7,z=-7+rnd()*11;const ax=Math.abs(x),az=Math.abs(z);if(ax<MAT.w/2-.04&&az<MAT.d/2-.04)continue;
    const far=Math.hypot(x,z);if(far>3&&rnd()<(far-3)/5)continue;
    o.position.set(x,0,z);o.rotation.set(0,rnd()*Math.PI,0);const h=(.035+rnd()*.07+(rnd()<.05?.05:0))*(z>1.3?.75:1);o.scale.set(.006+rnd()*.006,h,1);o.updateMatrix();im.setMatrixAt(n,o.matrix);
    col.setHSL(.2+rnd()*.07,.5+rnd()*.25,.12+rnd()*.13);im.setColorAt(n,col);n++}
  scene.add(im)}
// a few daisies in the grass
{const c=canvas(64,64),x=c.getContext('2d');x.translate(32,32);x.fillStyle='#fff';for(let i=0;i<12;i++){x.rotate(Math.PI/6);x.beginPath();x.ellipse(0,-15,4,12,0,0,7);x.fill()}x.fillStyle='#f3b81f';x.beginPath();x.arc(0,0,7,0,7);x.fill();
  const g=new THREE.PlaneGeometry(.03,.03);g.rotateX(-Math.PI/2);const m=new THREE.MeshStandardMaterial({map:tex(c),alphaTest:.5,roughness:.8,side:THREE.DoubleSide});
  const im=new THREE.InstancedMesh(g,m,220),o=new THREE.Object3D();let n=0;while(n<220){const x2=(rnd()*2-1)*5,z=-5+rnd()*8;if(Math.abs(x2)<MAT.w/2+.05&&Math.abs(z)<MAT.d/2+.05)continue;o.position.set(x2,.05+rnd()*.06,z);o.rotation.set((rnd()-.5)*.6,rnd()*6,(rnd()-.5)*.6);o.scale.setScalar(.7+rnd()*.6);o.updateMatrix();im.setMatrixAt(n++,o.matrix)}scene.add(im)}

/* ---------------- the mat: woven gingham cotton that lifts in the wind ---------------- */
const matG=new THREE.PlaneGeometry(MAT.w,MAT.d,MOB?150:220,MOB?106:156);matG.rotateX(-Math.PI/2);
const mp=matG.attributes.position,MV=mp.count,base=new Float32Array(MV),fold=new Float32Array(MV),mx=new Float32Array(MV),mz=new Float32Array(MV);
// soft draped folds, like cotton that was shaken out and dropped on the grass
const FOLDS=[];for(let k=0;k<11;k++){const a=rnd()*Math.PI,cx=(rnd()-.5)*MAT.w*.95,cz=(rnd()-.5)*MAT.d*.95;FOLDS.push({cx,cz,ux:Math.cos(a),uz:Math.sin(a),L:.3+rnd()*.55,A:(.016+rnd()*.03)*(rnd()<.2?-.4:1),w:.035+rnd()*.07,sk:rnd()*.6+.4})}
for(let i=0;i<MV;i++){const x=mp.getX(i),z=mp.getZ(i);mx[i]=x;mz[i]=z;
  let h=fbm(x*2.2+4,z*2.2+9,4)*.014-.007+noise(x*12,z*12)*.002;
  for(const F of FOLDS){const dx=x-F.cx,dz=z-F.cz,t=dx*F.ux+dz*F.uz,d=-dx*F.uz+dz*F.ux;const along=Math.exp(-(t*t)/(F.L*F.L));
    const prof=d>0?Math.exp(-d/(F.w*F.sk)):Math.exp(d/F.w);h+=F.A*along*prof*prof*(1+.25*Math.sin(t*14))}
  fold[i]=h;
  base[i]=.012-.006*Math.min(1,Math.max(0,1-Math.min(MAT.w/2-Math.abs(x),MAT.d/2-Math.abs(z))/.05))}// edges settle into the grass
let pinF=null,pinN=-1;
let matTex,matNor;
{const W=2400,H=1700,c=canvas(W,H),x=c.getContext('2d');const im=x.createImageData(W,H),d=im.data;const sq=80;// 8cm checks, red cotton gingham
  for(let j=0;j<H;j++){const hb=((j/sq)|0)%2===0;for(let i=0;i<W;i++){const k=(j*W+i)*4,vb=((i/sq)|0)%2===0;let r,g,b;
    if(vb&&hb){r=214;g=26;b=26}
    else if(vb||hb){const tw2=(i+j)%7<4;r=tw2?220:242;g=tw2?36:182;b=tw2?32:176}// twill: fine diagonal red and white threads
    else{r=247;g=244;b=240}
    const n=(noise(i*.8,j*.8)-.5)*12+(fbm(i/260,j/260,3)-.5)*14+((i%2)?-3:0)+((j%2)?-2:0);d[k]=r+n;d[k+1]=g+n*.9;d[k+2]=b+n*.9;d[k+3]=255}}
  x.putImageData(im,0,0);

cv.addEventListener('wheel',e=>{e.preventDefault();tRad=Math.max(.5,Math.min(4.5,tRad*(1+e.deltaY*.001)))},{passive:false});

/* ---------------- picking ---------------- */
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
function pick(e){ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(ndc,cam);
  const objs=hot.map(h=>h.obj).concat([mat]);const hits=ray.intersectObjects(objs,true);
  for(const h of hits){if(h.object===mat)return{mat:h};const H=hot.find(o=>o.obj===h.object||isChild(o.obj,h.object));if(!H)continue;
    if(H.alpha){const T=H.alpha.texs[H.alpha.pose];const px=Math.floor(h.uv.x*T.w),py=Math.floor((1-h.uv.y)*T.h);if(T.data[(py*T.w+px)*4+3]<60)continue}return{hot:H,point:h.point}}return null}
const isChild=(p,o)=>{while(o){if(o===p)return true;o=o.parent}return false};
function hover(e){if(drag&&moved>5)return;const r=pick(e),tip=$('#tip');cv.classList.toggle('hot',!!(r&&r.hot));if(r&&r.hot){tip.textContent=r.hot.label;tip.style.left=e.clientX+'px';tip.style.top=e.clientY+'px';tip.classList.add('on')}else tip.classList.remove('on')}
function focusOn(o){bb.setFromObject(o);bb.getCenter(goal);const s=bb.getSize(v3).length();goal.y=Math.max(goal.y,.05);tRad=Math.max(.55,Math.min(1.6,s*2.6))}
function home(){goal.copy(HOME);tRad=homeRad}
addEventListener('keydown',e=>{if(e.key==='Escape')home()});
function tap(e){const r=pick(e);if(!r){home();return}if(r.hot){focusOn(r.hot.obj);r.hot.click();hideHint()}else if(r.mat){home();ripples.push({x:r.mat.point.x,z:r.mat.point.z,t:0});sfx('tap');hideHint()}}
let hinted=false;function hideHint(){if(hinted)return;hinted=true;$('#hint').style.opacity=0}

/* ---------------- speech bubble that follows the speaker ---------------- */
let bubT=null,bubObj=null;const bub=$('#bub');
function say(obj,txt,who){bubObj=obj;bub.innerHTML=(who?`<small>${who}</small>`:'')+txt.replace(/</g,'&lt;');bub.classList.add('on');clearTimeout(bubT);bubT=setTimeout(()=>{bub.classList.remove('on');bubObj=null},3200)}
const v3=new THREE.Vector3(),bb=new THREE.Box3();
function placeBub(){if(!bubObj)return;bb.setFromObject(bubObj);v3.set((bb.min.x+bb.max.x)/2,bb.max.y,(bb.min.z+bb.max.z)/2).project(cam);
  bub.style.left=Math.max(130,Math.min(innerWidth-130,(v3.x*.5+.5)*innerWidth))+'px';bub.style.top=Math.max(80,(-v3.y*.5+.5)*innerHeight)+'px'}

/* ---------------- chips for keyboard + quick taps ---------------- */
function chips(){const box=$('#chips');box.innerHTML='';hot.forEach(h=>{if([...box.children].some(x=>x.dataset.n===h.name))return;const b=document.createElement('button');b.type='button';b.className='chip';b.dataset.n=h.name;b.textContent=h.name;b.addEventListener('click',()=>{focusOn(h.obj);h.click();hideHint()});box.appendChild(b)});
  const w=document.createElement('button');w.type='button';w.className='chip';w.textContent='🍃 big gust';w.addEventListener('click',()=>{home();gustT=2.6;hideHint()});box.appendChild(w)}
$('#tod').addEventListener('click',()=>{setTod(TODK[(TODK.indexOf(tod)+1)%TODK.length]);sfx('tap')});

/* ---------------- wind ---------------- */
let gust=0,gustT=0,nextGust=3;
function size(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.fov=w<h?58:46;tRad=homeRad=w<h?3.3:2.3;tPo=w<h?.22:.3;tAz=w<h?Math.PI/2:0;cam.updateProjectionMatrix()}
addEventListener('resize',size);size();rad=tRad;

/* ---------------- frame loop ---------------- */
const clock=new THREE.Clock();let T=0;
function frame(){const dt=Math.min(clock.getDelta(),.05);T+=dt;U.time.value=T;
  if(intro<1)intro+=dt/2.6;tgt.lerp(goal,.06);az+=(tAz-az)*.08;po+=(tPo-po)*.08;rad+=(tRad-rad)*.08;placeCam();
  // gusts come and go
  nextGust-=dt;if(nextGust<0&&!RM){gustT=1.4+Math.random()*1.8;nextGust=5+Math.random()*7}
  gustT-=dt;const gTarget=gustT>0?1:0;gust+=(gTarget-gust)*(gTarget?1.6:.7)*dt;U.wind.value=RM?0:gust;
  if(windGain)windGain.gain.value=SND?.04+gust*.22:0;
  // mat: creases + corners lifted by the wind + ripples from taps
  const pa=mp.array;const lift=RM?0:gust;
  if(pinN!==pins.length){pinN=pins.length;pinF=new Float32Array(MV);for(let i=0;i<MV;i++){let p=1;for(const [px,pz,pr] of pins){const d2=(mx[i]-px)**2+(mz[i]-pz)**2;p*=1-Math.exp(-d2/(pr*pr))}pinF[i]=p}}
  for(let i=0;i<MV;i++){const x=mx[i],z=mz[i];const pin=pinF[i];let y=base[i]+fold[i]*pin;
    const dl=x+MAT.w/2;// upwind (left) edge catches the wind
    const c1=Math.hypot(dl,z+MAT.d/2),c2=Math.hypot(dl,z-MAT.d/2);
    let f=.11*lift*(Math.exp(-c1*c1/.09)+Math.exp(-c2*c2/.06))*(1+.25*Math.sin(T*9-c1*12));
    f+=.012*lift*Math.exp(-dl/.12)*Math.sin(z*9-T*10);
    f+=.002*Math.sin(T*1.3+x*2+z*3)*Math.exp(-dl/.3)*(1-lift);
    for(const r of ripples){const d=Math.hypot(x-r.x,z-r.z);f+=.012*Math.exp(-r.t*1.8)*Math.sin(d*28-r.t*14)*Math.exp(-d*3)*(d<r.t*.55+.05?1:0)}
    pa[i*3+1]=Math.max(.005,y+f*pin)}
  mp.needsUpdate=true;matG.computeVertexNormals();
  for(let i=ripples.length-1;i>=0;i--){ripples[i].t+=dt;if(ripples[i].t>2.5)ripples.splice(i,1)}
  // cans tipping and rolling
  for(const o of cans){if(!o.anim)continue;const a=o.anim;a.t+=dt/.55;const k=ease(a.t);const g=o.g.children[0];g.rotation.z=a.from.rz+(a.to.rz-a.from.rz)*k;g.position.y=a.from.y+(a.to.y-a.from.y)*k;g.position.x=a.from.x+(a.to.x-a.from.x)*k;if(a.t>=1)o.anim=null}
  // bag + keyring
  if(bag){bagJig=Math.max(0,bagJig-dt*1.6);bag.children[0].rotation.z=Math.sin(T*22)*.03*bagJig;bag.children[0].scale.y=1-Math.sin(T*22)*.02*bagJig;
    const r=ring.userData;r.v+=(-9.8/0.06*Math.sin(r.a)*.08-r.v*1.2+gust*Math.sin(T*7)*4)*dt;r.a+=r.v*dt;ring.rotation.z=r.a;ring.rotation.x=Math.sin(r.a*1.3)*.3}
  if(phone){buzz=Math.max(0,buzz-dt);phone.position.x=.6+Math.sin(T*90)*.0025*Math.sign(buzz)*(Math.sin(T*9)>0?1:0);phone.rotation.y=-.5+Math.sin(T*70)*.03*(buzz>0?1:0)}
  updateThings(dt);
  // leaves: lifted and carried by gusts, settle back down
  for(const L of leaves){if(!RM&&gust>.35&&!L.fly&&Math.random()<dt*1.5*gust){L.fly=true;L.v.set(.4,.6+Math.random()*.8,(Math.random()-.5)*.4);L.rv.set(Math.random()*8,Math.random()*8,Math.random()*8)}
    if(L.fly){L.v.x+=(1.6*gust-L.v.x*.6)*dt;L.v.y+=(-1.1+gust*1.2*Math.sin(T*5+L.p.z*9))*dt;L.v.z+=Math.sin(T*3+L.p.x*7)*.3*dt;L.p.addScaledVector(L.v,dt);L.r.addScaledVector(L.rv,dt);
      if(L.p.y<.014&&L.v.y<0){L.fly=false;L.p.y=.014;L.r.set(-Math.PI/2,0,L.r.z)}
      if(L.p.x>3.2){L.p.set(-3.2,.4+Math.random(),(Math.random()*2-1)*1.5);L.fly=true}}
    L.m.position.copy(L.p);L.m.rotation.set(L.r.x,L.r.y,L.r.z)}
  for(const s of clouds){s.position.x+=s.userData.v*dt;if(s.position.x>80)s.position.x=-80}
  placeBub();R.render(scene,cam);requestAnimationFrame(frame)}

/* ---------------- lay out the cables and cans, then start ---------------- */
cable([[-.28,.2],[-.16,.1],[-.04,.22],[.08,.12],[.18,.24],[.3,.16]],0xf2f2f0,.38,true);
cable([[-.22,.36],[-.1,.3],[0,.4],[.1,.32],[.2,.4]],0x1b1b1d,.5,false);
cable([[-.38,-.08],[-.26,-.16],[-.14,-.06],[-.02,-.14],[.08,-.06]],0xff6fa8,.55,false);

addCan('#ff7a1a','#c94e00','ORANGE',.46,.02,.6,false);addCan('#2aa9de','#11729e','LEMON',.58,.13,-.4,false);addCan('#6fbf3b','#3f8a1a','GREEN APPLE',.7,-.06,1.2,true);
hot.push({obj:cables[0].g,name:'cables',label:'type-C, lightning, the weird old one · one for everyone',click:()=>{say(cables[0].g,'whose phone is at 2%? I got you','')}});
cables.slice(1).forEach(c=>hot.push({obj:c.g,name:'cables',label:'one charger each. that’s love',click:()=>say(c.g,'that’s love, actually','')}));
// soft contact shadows under everything sitting on the mat (ambient occlusion)
{const c=canvas(128,128),x=c.getContext('2d'),g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,'rgba(30,18,10,.55)');g.addColorStop(.55,'rgba(30,18,10,.22)');g.addColorStop(1,'rgba(30,18,10,0)');x.fillStyle=g;x.fillRect(0,0,128,128);
  const t=tex(c);pins.forEach(([px,pz,pr])=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(pr*1.5,pr*1.5),new THREE.MeshBasicMaterial({map:t,transparent:true,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-4}));m.rotation.x=-Math.PI/2;m.position.set(px,.0205,pz);m.renderOrder=1;scene.add(m)})}
setTod(tod);makeEnv();
chips();$('#load').classList.add('done');
requestAnimationFrame(frame);
})();
</script>
</body></html>
